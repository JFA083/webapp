<VirtualHost *:80>
    ServerName tardrop.example.com

    # Taille maximale acceptée par Apache pour l'upload (doit couvrir TARDROP_MAX_MB)
    LimitRequestBody 536870912

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog  logs/tardrop-error.log
    CustomLog logs/tardrop-access.log combined
</VirtualHost>

# Variante HTTPS recommandée (certbot --apache) :
#
# <VirtualHost *:443>
#     ServerName tardrop.example.com
#     LimitRequestBody 536870912
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:8000/
#     ProxyPassReverse / http://127.0.0.1:8000/
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/tardrop.example.com/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/tardrop.example.com/privkey.pem
# </VirtualHost>
