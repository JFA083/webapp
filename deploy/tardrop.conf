# TarDrop — deux modes de déploiement Apache.
#
# MODE 1 (recommandé, votre cas) : intégration à un vhost HTTPS existant
# qui authentifie déjà via PAM (mod_authnz_pam, AuthPAMService httpd).
# Copiez ce bloc *dans* votre vhost *:443 existant puis :
#   apachectl configtest && systemctl reload httpd

<Location />
    AuthType Basic
    AuthName "TarDrop"
    AuthBasicProvider PAM
    AuthPAMService httpd
    Require valid-user
</Location>

# Passe l'utilisateur authentifié à l'application (traçabilité des jobs)
RequestHeader set X-Remote-User "%{REMOTE_USER}s" env=REMOTE_USER

# Taille max acceptée par Apache pour l'upload (doit couvrir TARDROP_MAX_MB)
LimitRequestBody 536870912

# Mise en proxy vers le service systemd TarDrop
ProxyPass        /tardrop/ http://127.0.0.1:8000/
ProxyPassReverse /tardrop/ http://127.0.0.1:8000/


# MODE 2 : vhost TarDrop autonome (si vous préférez un serveur virtuel dédié).
# Adaptez ServerName et les chemins de certificats, puis :
#   cp /opt/tardrop/app/deploy/tardrop.conf /etc/httpd/conf.d/
#   apachectl configtest && systemctl reload httpd
#
# <VirtualHost *:443>
#     ServerName tardrop.example.com
#     LimitRequestBody 536870912
#
#     <Location />
#         AuthType Basic
#         AuthName "TarDrop"
#         AuthBasicProvider PAM
#         AuthPAMService httpd
#         Require valid-user
#     </Location>
#     RequestHeader set X-Remote-User "%{REMOTE_USER}s" env=REMOTE_USER
#
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:8000/
#     ProxyPassReverse / http://127.0.0.1:8000/
#
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/tardrop.example.com/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/tardrop.example.com/privkey.pem
#     ErrorLog  logs/tardrop-error.log
#     CustomLog logs/tardrop-access.log combined
# </VirtualHost>
